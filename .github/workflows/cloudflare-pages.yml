name: Deploy Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check static site
        run: npm run check
      - name: Prepare site metadata
        run: npm run prepare:site
        env:
          PUBLISHED_SHEETS_URL: ${{ vars.PUBLISHED_SHEETS_URL }}
      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy public --project-name zinsei-lab --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
